      content="ZOSIMAS Digital Solution PLC designs and develops modern digital solutions across web, mobile, and AI."
    />
    <title>ZOSIMAS Digital Solution PLC | Web, Mobile & AI Solutions</title>
    <script>
      try {
        var theme = localStorage.getItem('zosimas-theme');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        var locale = localStorage.getItem('zosimas-locale');
        if (locale === 'am' || locale === 'en') document.documentElement.lang = locale;
      } catch (e) {}
    </script>

    />
